- id: session-log-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      dashscope-qwen:
        displayName: Qwen 3.8 (DashScope)
        apiKeyEnv: DASHSCOPE_API_KEY
        api: openai-completions
        baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: qwen3.8-flash
            name: Qwen 3.8 Flash
            contextWindow: 1048576
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: qwen3.8-max-0902
            name: Qwen 3.8 Max 0902
            contextWindow: 262144
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high

- id: agent-default-model
  config:
    provider: dashscope-qwen
    model: qwen3.8-flash
    reasoningEffort: high

- id: system-prompt
  config:
    personaPrefix: >-
      你是由 {{model}} 模型驱动的 CNC 工程智能体。除非用户明确要求使用其他语言，
      所有面向用户可见的内容都必须使用简体中文。
    personaSuffix: >-
      当前工作目录是 {{cwd}}。必须使用简体中文输出可见的思考与推理摘要、计划、
      工具调用前后说明、进度状态、澄清问题、阶段性结论和最终报告。不得先用英文思考或说明再翻译为中文。
      工具返回英文内容时，应优先用中文概括和解释，不要无必要地原样复述英文。
      仅代码、命令、文件路径、工具 ID、API 字段、参数名、标准型号以及无法准确翻译的专有名词可以保留原文。

- id: workspace-controller
  config:
    documentsDirectory: /workspace

- insert:
    - id: mcp-seksun-cnc
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: cnc
        transport: stdio
        command: python3
        args: ["-m", "app.cnc_mcp"]
        cwd: /opt/seksun-cnc-api
        env:
          CNC_API_BASE_URL: http://api:8090
          CNC_MCP_IMPORT_ROOTS: /var/lib/deepseek-harness:/workspace
        toolCallTimeoutMs: 300000
        failOnStartupError: true
